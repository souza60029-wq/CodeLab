name: CodeLab
options:
  bundleIdPrefix: com.codelab
  deploymentTarget:
    iOS: "15.0"
targets:
  CodeLab:
    type: application
    platform: iOS
    sources: [CodeLab]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: CodeLab
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cod.lab
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
