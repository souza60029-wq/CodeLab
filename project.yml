name: CodeLab
options:
  bundleIdPrefix: com.code
  deploymentTarget:
    iOS: "15.0"
targets:
  CodeLab:
    type: application
    platform: iOS
    sources:
      - CodeLab
      - path: Resources
        optional: true
    dependencies:
      - framework: Frameworks/ios_system.xcframework
        embed: true
      - framework: Frameworks/files.xcframework
        embed: true
        link: false
      - framework: Frameworks/shell.xcframework
        embed: true
        link: false
      - framework: Frameworks/text.xcframework
        embed: true
        link: false
      - framework: Frameworks/tar.xcframework
        embed: true
        link: false
      - framework: Frameworks/awk.xcframework
        embed: true
        link: false
      - framework: Frameworks/curl_ios.xcframework
        embed: true
        link: false
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: CodeLab
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.code.lab
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
